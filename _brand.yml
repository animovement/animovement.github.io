# Central brand definition for animovement.dev — colours + typography.
# Colours apply because _quarto.yml lists `brand` AFTER the bootswatch theme
# (theme: [cosmo, brand, custom.scss]); brand is otherwise lowest priority.

color:
  palette:
    teal: "#0d9488"
  primary: teal

typography:
  fonts:
    - family: Lato
      source: google
      weight: [300, 400, 700, 900]
    - family: Source Code Pro
      source: google
      weight: [400, 500]
  base:
    family: Lato
  headings:
    family: Lato
    weight: 700
  monospace:
    family: Source Code Pro
