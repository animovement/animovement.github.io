name: Publish site

on:
  push:
    branches: [main]
  # The contributing guide, AI policy and code of conduct pages are fetched
  # from animovement/.github on every build, so rebuild weekly to pick up
  # their changes even when nothing here has changed
  schedule:
    - cron: "0 5 * * 1" # every Monday 05:00 UTC
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The project .Rprofile activates renv; this job installs only what the
      # render needs, so keep renv from taking over the library.
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Pages that run R code are replayed from the committed _freeze/ cache,
      # so the analysis packages in renv.lock are not needed here. Only the
      # contributing guide, AI policy and code of conduct pages run at build
      # time (they fetch their document from animovement/.github), and they
      # need nothing beyond knitr and rmarkdown. Re-render and commit _freeze/
      # locally, with renv, whenever a guide changes.
      - name: Install knitr and rmarkdown
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
